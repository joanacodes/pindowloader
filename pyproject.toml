[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pindowloader"
dynamic = ["version"]
description = "Download every pin from a Pinterest board at original resolution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["gallery-dl>=1.30"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pindowloader = "pindowloader.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pindowloader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
